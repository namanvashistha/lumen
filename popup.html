<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumen</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 360px;
      padding: 16px;
      background: #1a1a2e;
      color: #eaeaea;
    }
    
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #00d9ff;
    }
    
    .config-section {
      margin-bottom: 16px;
    }
    
    label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
    }
    
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #0f0f1a;
      color: #eaeaea;
      font-size: 13px;
      margin-bottom: 10px;
    }
    
    input:focus {
      outline: none;
      border-color: #00d9ff;
    }
    
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    
    button {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    #saveConfig {
      background: #333;
      color: #eaeaea;
      margin-bottom: 8px;
    }
    
    #saveConfig:hover {
      background: #444;
    }
    
    #startBtn {
      background: linear-gradient(135deg, #0077b5, #00a0dc);
      color: #fff;
    }
    
    #startBtn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 160, 220, 0.3);
    }
    
    #fullScrapeBtn {
      background: linear-gradient(135deg, #00b894, #00cec9);
      color: #fff;
    }
    
    #fullScrapeBtn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 206, 201, 0.3);
    }
    
    #resumeBtn {
      background: linear-gradient(135deg, #fdcb6e, #f39c12);
      color: #1a1a2e;
      display: none;
    }
    
    #resumeBtn:hover:not(:disabled) {
      transform: translateY(-1px);
    }
    
    #stopBtn {
      background: #e74c3c;
      color: #fff;
    }
    
    #stopBtn:hover {
      background: #c0392b;
    }
    
    button:disabled {
      background: #333 !important;
      color: #666 !important;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }
    
    #status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 11px;
      background: #0f0f1a;
      border: 1px solid #333;
      min-height: 80px;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .status-line {
      margin-bottom: 4px;
      color: #888;
      word-break: break-word;
    }
    
    .status-line.success {
      color: #4ade80;
    }
    
    .status-line.error {
      color: #f87171;
    }
    
    .status-line.info {
      color: #00d9ff;
    }
    
    .warning-text {
      font-size: 10px;
      color: #666;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🔗 Lumen</h1>
  
  <div class="config-section">
    <label for="botToken">Telegram Bot Token</label>
    <input type="password" id="botToken" placeholder="123456789:ABCdefGHI...">
    
    <label for="chatId">Telegram Chat ID</label>
    <input type="text" id="chatId" placeholder="-1001234567890">
    
    <button id="saveConfig">Save Config</button>
    <button id="testTelegram" style="background: #555; color: #00d9ff; margin-top: 4px;">Test Connection</button>
  </div>
  
  <div id="progressSection" style="display: none; margin-bottom: 12px; padding: 10px; background: #0f0f1a; border: 1px solid #333; border-radius: 6px;">
    <div style="display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 11px; color: #888;">
      <span id="progressText">0 / 0</span>
      <span id="etaText">ETA: --</span>
    </div>
    <div style="width: 100%; height: 6px; background: #333; border-radius: 3px; overflow: hidden;">
      <div id="progressBar" style="height: 100%; width: 0%; background: linear-gradient(90deg, #00d9ff, #0077b5); transition: width 0.3s;"></div>
    </div>
  </div>
  
  <div class="btn-group">
    <button id="startBtn">🚀 Quick Extract (Names Only)</button>
    <button id="fullScrapeBtn">🔍 Full Scrape (With Contact Info)</button>
    <button id="exportCsvBtn" style="background: #6c5ce7; display: none;">📥 Download as CSV</button>
    <button id="resumeBtn">⏯️ Resume Scraping</button>
    <button id="stopBtn">🛑 Stop & Clear</button>
  </div>
  
  <div id="status">
    <div class="status-line">Ready. Make sure you're logged into LinkedIn.</div>
  </div>
  
  <div style="font-size: 10px; color: #888; margin-top: 8px; padding: 8px; background: #0f0f1a; border-radius: 4px;">
    <div style="margin-bottom: 4px;">💡 <b>Quick Extract:</b> Fast (~2 min) - names & profile URLs</div>
    <div>⚠️ <b>Full Scrape:</b> Slow (~1 min/profile) - emails & phones</div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
